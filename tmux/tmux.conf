# kanso — tmux config

# ─── layout ───────────────────────────────────────────
set-option -g status-position        "bottom"
set-option -g status-style           bg=#c9cbd1,fg=#545464

# ─── left: tmux label (normal / prefix) ───────────────
set-option -g status-left \
  '#[bg=#c9cbd1,fg=#545464,bold]#{?client_prefix,,  tmux  }#[bg=#4d699b,fg=#f2f1ef,bold]#{?client_prefix,  tmux  ,}'

# ─── right: session name ──────────────────────────────
set-option -g status-right           '#S 🦍 λx.x '
set-option -g status-right-style     bg=#c9cbd1,fg=#545464

# ─── windows ──────────────────────────────────────────
set-option -g window-status-style    bg=#c9cbd1,fg=#545464
set-option -g window-status-format   ' #I:#W '

set-option -g window-status-current-style  bg=#4d699b,fg=#f2f1ef
set-option -g window-status-current-format ' #I:#W#{?window_zoomed_flag,  , } '

# ─── pane borders ─────────────────────────────────────
set-option -g pane-border-style      fg=#c9cbd1
set-option -g pane-active-border-style fg=#4d699b

# ─── message / command prompt ─────────────────────────
set-option -g message-style          bg=#c9cbd1,fg=#14171d
set-option -g message-command-style  bg=#77713f,fg=#f2f1ef

# ─── copy mode highlight ──────────────────────────────
set-option -g mode-style             bg=#c9cbd1,fg=#14171d

# ─── terminal ─────────────────────────────────────────
set-option -ga terminal-overrides    ",xterm-256color:Tc"
set -g default-terminal              "tmux-256color"
set -g mouse on
